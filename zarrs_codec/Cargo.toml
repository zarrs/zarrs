[package]
name = "zarrs_codec"
version = "0.3.0"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
edition = "2024"
rust-version = "1.92"
description = "The codec API for the zarrs crate"
homepage = "https://zarrs.dev"
documentation = "https://docs.rs/zarrs_codec"
repository = "https://github.com/zarrs/zarrs/tree/main/zarrs_codec"
license = "MIT OR Apache-2.0"
keywords = ["zarr", "zarrs"]
categories = ["encoding"]

[dependencies]
async-lock = "3.4.0"
async-trait = { version = "0.1.74", optional = true }
bytemuck = { version = "1.14.0", features = ["must_cast", "extern_crate_alloc"] }
bytes.workspace = true
crossbeam-channel = "0.5.13"
derive_more = { version = "2.0.0", features = ["deref", "display", "from"] }
futures = "0.3.29"
inventory.workspace = true
itertools = "0.15.0"
rayon = "1.10.0"
serde_json = "1.0.71"
smallvec = "1.13"
thiserror.workspace = true
unsafe_cell_slice = "0.2.0"
zarrs_chunk_grid.workspace = true
zarrs_data_type.workspace = true
zarrs_metadata.workspace = true
zarrs_plugin.workspace = true
zarrs_storage.workspace = true

[dev-dependencies]
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread", "time"] }

[features]
async = ["dep:async-trait", "zarrs_storage/async"]

[lints]
workspace = true
